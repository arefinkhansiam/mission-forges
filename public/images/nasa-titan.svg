<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="titanGlow" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffe3a8" />
      <stop offset="30%" stop-color="#f0a53a" />
      <stop offset="65%" stop-color="#9e5d16" />
      <stop offset="85%" stop-color="#4d2c08" />
      <stop offset="100%" stop-color="#140a02" />
    </radialGradient>
    <radialGradient id="titanHaze" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#64a5ff" stop-opacity="0" />
      <stop offset="98%" stop-color="#64a5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3d82e8" stop-opacity="0.9" />
    </radialGradient>
    <clipPath id="titanClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#040b18" />
  <!-- Thick Nitrogen / Methane Atmosphere -->
  <circle cx="256" cy="256" r="220" fill="url(#titanGlow)" />
  <!-- Hydrocarbon Dunes and Polar Methane Seas -->
  <g clip-path="url(#titanClip)" opacity="0.35">
    <!-- Kraken Mare and Ligeia Mare polar lakes -->
    <path d="M 190,90 C 220,70 290,75 320,105 C 280,120 230,110 190,90 Z" fill="#1b1206" />
    <path d="M 140,110 C 170,125 180,145 160,160 C 130,150 120,130 140,110 Z" fill="#1b1206" />
    <!-- Equatorial dark sand dunes (Shangri-La) -->
    <path d="M 60,260 Q 220,290 460,240 Q 320,320 60,260 Z" fill="#2e1c0c" />
    <path d="M 80,310 Q 260,350 440,290 Q 280,370 80,310 Z" fill="#2e1c0c" />
  </g>
  <!-- High-altitude detached blue haze rim -->
  <circle cx="256" cy="256" r="220" fill="url(#titanHaze)" />
</svg>
