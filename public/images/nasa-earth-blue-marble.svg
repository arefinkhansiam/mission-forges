<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="earthGlow" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#4aa3ff" />
      <stop offset="28%" stop-color="#1d5fcc" />
      <stop offset="65%" stop-color="#0b2866" />
      <stop offset="85%" stop-color="#041233" />
      <stop offset="100%" stop-color="#010512" />
    </radialGradient>
    <radialGradient id="earthAtmo" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#73b9ff" stop-opacity="0" />
      <stop offset="96%" stop-color="#4aa3ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a6d5ff" stop-opacity="0.9" />
    </radialGradient>
    <clipPath id="earthClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
    <filter id="cloudSoft">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="#020612" />
  <!-- Ocean Globe -->
  <circle cx="256" cy="256" r="220" fill="url(#earthGlow)" />
  <!-- Continents & Landmasses -->
  <g clip-path="url(#earthClip)" opacity="0.82">
    <!-- North & South America approximation -->
    <path d="M 140,110 Q 180,90 220,130 Q 250,170 210,210 Q 170,230 150,190 Q 120,150 140,110 Z" fill="#2d7a3e" />
    <path d="M 190,220 Q 240,240 230,310 Q 210,380 180,410 Q 160,370 170,300 Q 160,250 190,220 Z" fill="#388a4c" />
    <!-- Africa / Eurasia approximation -->
    <path d="M 280,110 Q 370,80 410,130 Q 430,200 370,240 Q 320,230 290,180 Q 260,140 280,110 Z" fill="#75883d" />
    <path d="M 290,220 Q 360,230 380,310 Q 360,390 320,410 Q 280,360 270,300 Q 270,240 290,220 Z" fill="#887948" />
    <!-- Desert Highlights -->
    <path d="M 300,170 Q 360,160 380,210 Q 340,230 300,210 Z" fill="#b09657" opacity="0.7" />
  </g>
  <!-- Swirling Clouds -->
  <g clip-path="url(#earthClip)" opacity="0.65" filter="url(#cloudSoft)">
    <path d="M 100,130 Q 240,100 360,160 Q 220,180 100,130 Z" fill="#ffffff" />
    <path d="M 80,240 Q 200,290 340,220 Q 260,210 80,240 Z" fill="#ffffff" />
    <path d="M 160,330 Q 280,310 400,370 Q 280,400 160,330 Z" fill="#ffffff" />
    <circle cx="210" cy="180" r="45" fill="#ffffff" opacity="0.5" />
    <path d="M 240,80 Q 260,50 310,70 Q 280,100 240,80 Z" fill="#ffffff" />
  </g>
  <!-- Atmosphere Outer Rim -->
  <circle cx="256" cy="256" r="220" fill="url(#earthAtmo)" />
</svg>
