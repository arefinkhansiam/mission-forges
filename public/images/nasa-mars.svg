<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="marsGlow" cx="40%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#ff8e66" />
      <stop offset="25%" stop-color="#db5a2c" />
      <stop offset="60%" stop-color="#8a2e12" />
      <stop offset="85%" stop-color="#4a1506" />
      <stop offset="100%" stop-color="#0f0301" />
    </radialGradient>
    <radialGradient id="marsAtmo" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#ffb294" stop-opacity="0" />
      <stop offset="97%" stop-color="#ff8c66" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e0623a" stop-opacity="0.6" />
    </radialGradient>
    <clipPath id="marsClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#030712" />
  <!-- Mars Sphere -->
  <circle cx="256" cy="256" r="220" fill="url(#marsGlow)" />
  <!-- Surface Features & Dark Albedo Markings -->
  <g clip-path="url(#marsClip)" opacity="0.45">
    <!-- Syrtis Major / Acidalia Planitia -->
    <path d="M 280,180 Q 340,150 370,220 Q 390,290 330,310 Q 290,280 270,230 Z" fill="#38150a" />
    <!-- Valles Marineris Canyon System -->
    <path d="M 120,270 Q 220,290 300,260 Q 240,245 120,270 Z" fill="#290e06" />
    <path d="M 140,220 Q 210,180 240,230 Q 180,250 140,220 Z" fill="#421a0f" />
    <!-- Hellas Basin -->
    <ellipse cx="320" cy="350" rx="45" ry="32" fill="#bf603b" opacity="0.6" />
    <!-- Olympus Mons Tharsis Volcanoes -->
    <circle cx="130" cy="180" r="14" fill="#66220e" />
    <circle cx="130" cy="180" r="4" fill="#a84323" />
    <circle cx="170" cy="220" r="10" fill="#66220e" />
    <circle cx="195" cy="255" r="9" fill="#66220e" />
    <circle cx="220" cy="290" r="9" fill="#66220e" />
  </g>
  <!-- North Polar Ice Cap -->
  <g clip-path="url(#marsClip)">
    <ellipse cx="256" cy="50" rx="75" ry="24" fill="#f8f4f0" opacity="0.92" />
    <ellipse cx="256" cy="50" rx="55" ry="16" fill="#ffffff" />
  </g>
  <!-- Thin Atmosphere Rim -->
  <circle cx="256" cy="256" r="220" fill="url(#marsAtmo)" />
</svg>
