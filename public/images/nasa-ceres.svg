<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ceresGlow" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d4d1cb" />
      <stop offset="30%" stop-color="#9e9a93" />
      <stop offset="65%" stop-color="#54524e" />
      <stop offset="85%" stop-color="#242321" />
      <stop offset="100%" stop-color="#080707" />
    </radialGradient>
    <clipPath id="ceresClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#020308" />
  <!-- Dwarf Planet Body -->
  <circle cx="256" cy="256" r="220" fill="url(#ceresGlow)" />
  <!-- Heavily Cratered Silicate Surface -->
  <g clip-path="url(#ceresClip)" opacity="0.5">
    <ellipse cx="180" cy="190" rx="40" ry="30" fill="#363431" />
    <ellipse cx="310" cy="280" rx="60" ry="42" fill="#2d2b29" />
    <ellipse cx="140" cy="310" rx="45" ry="35" fill="#383633" />
    <ellipse cx="340" cy="160" rx="35" ry="25" fill="#3a3835" />
    <circle cx="230" cy="120" r="25" fill="#3e3c38" />
    <circle cx="280" cy="380" r="30" fill="#292826" />
  </g>
  <!-- Occator Crater & Famous Bright Faculae (Sodium Carbonate Ice) -->
  <g clip-path="url(#ceresClip)">
    <!-- Occator Rim -->
    <ellipse cx="235" cy="235" rx="36" ry="28" fill="#292724" opacity="0.8" />
    <ellipse cx="235" cy="235" rx="32" ry="24" fill="#383531" opacity="0.9" />
    <!-- Cerealia Facula central glow -->
    <circle cx="235" cy="235" r="9" fill="#ffffff" />
    <circle cx="235" cy="235" r="16" fill="#cce6ff" opacity="0.45" />
    <!-- Vinalia Faculae secondary spots -->
    <circle cx="245" cy="226" r="4" fill="#f0f8ff" />
    <circle cx="248" cy="232" r="3" fill="#f0f8ff" />
    <circle cx="242" cy="242" r="3" fill="#f0f8ff" />
  </g>
  <!-- Haulani Crater secondary bright spot -->
  <g clip-path="url(#ceresClip)">
    <circle cx="160" cy="260" r="6" fill="#eef6ff" opacity="0.85" />
    <circle cx="160" cy="260" r="12" fill="#cce6ff" opacity="0.3" />
  </g>
</svg>
